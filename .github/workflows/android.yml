name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','config.js','icons/**','android-app/**','.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Prepare web files
        working-directory: android-app
        run: |
          mkdir -p www assets
          cp ../index.html ../config.js ../manifest.webmanifest ../sw.js www/
          cp -r ../icons www/icons
          cp ../icons/icon-512.png assets/icon-only.png
          cp ../icons/icon-512.png assets/icon-foreground.png
          cp ../icons/icon-512.png assets/splash.png
      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; z=${d##*:}
            convert ../icons/icon-512.png -resize ${z}x${z} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            rm -f $R/mipmap-$n/ic_launcher_foreground.png
          done
          npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: madakhil-apk, path: android-app/android/app/build/outputs/apk/debug/app-debug.apk}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: التطبيق (APK)
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
